<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Inventaris Barang</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-gray-50 font-sans text-gray-900">

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-600 to-indigo-800 p-4">
        <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl p-8 transform transition-all">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-100 text-blue-600 rounded-full mb-4 text-2xl shadow-inner">
                    <i class="fa-solid fa-boxes-stacked"></i>
                </div>
                <h1 class="text-2xl font-bold text-gray-800">Sistem Inventaris</h1>
                <p class="text-sm text-gray-500 mt-1">Silakan masuk menggunakan akun Anda</p>
            </div>
            
            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400"><i class="fa-solid fa-user"></i></span>
                        <input type="text" id="loginUsername" required class="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm" placeholder="Masukkan username">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" id="loginPassword" required class="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm" placeholder="Masukkan password">
                    </div>
                </div>
                <button type="submit" id="loginBtn" class="w-full bg-blue-600 text-white font-semibold py-2.5 rounded-lg hover:bg-blue-700 transition duration-200 shadow-lg shadow-blue-500/30 flex items-center justify-center space-x-2">
                    <span>Masuk</span>
                    <i class="fa-solid fa-arrow-right-to-bracket"></i>
                </button>
            </form>
            <div class="mt-6 text-center text-xs text-gray-400">
                Default: Username: <b>admin</b> | Password: <b>admin123</b>
            </div>
        </div>
    </div>

    <!-- MAIN APP SCREEN (Hidden by default) -->
    <div id="appScreen" class="hidden min-h-screen flex flex-col md:flex-row">
        
        <!-- SIDEBAR -->
        <aside class="w-full md:w-64 bg-slate-900 text-slate-300 flex flex-col justify-between shadow-xl">
            <div>
                <div class="p-5 flex items-center space-x-3 border-b border-slate-800">
                    <div class="bg-blue-600 text-white p-2.5 rounded-xl text-lg shadow">
                        <i class="fa-solid fa-warehouse"></i>
                    </div>
                    <div>
                        <h2 class="font-bold text-white text-base">GudangKu</h2>
                        <p class="text-xs text-slate-400">Sistem Manajemen Stok</p>
                    </div>
                </div>
                <nav class="p-4 space-y-1.5 text-sm font-medium">
                    <button onclick="switchTab('dashboard')" id="nav-dashboard" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl transition bg-blue-600 text-white shadow-md shadow-blue-600/20">
                        <i class="fa-solid fa-chart-pie w-5"></i>
                        <span>Dashboard</span>
                    </button>
                    <button onclick="switchTab('items')" id="nav-items" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl transition hover:bg-slate-800 text-slate-300">
                        <i class="fa-solid fa-boxes-stacked w-5"></i>
                        <span>Daftar Barang</span>
                    </button>
                    <button onclick="switchTab('inbound')" id="nav-inbound" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl transition hover:bg-slate-800 text-slate-300">
                        <i class="fa-solid fa-cart-arrow-down w-5"></i>
                        <span>Barang Masuk</span>
                    </button>
                    <button onclick="switchTab('outbound')" id="nav-outbound" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl transition hover:bg-slate-800 text-slate-300">
                        <i class="fa-solid fa-cart-shopping w-5"></i>
                        <span>Barang Keluar</span>
                    </button>
                </nav>
            </div>
            
            <div class="p-4 border-t border-slate-800">
                <div class="flex items-center justify-between mb-3 px-2">
                    <div class="flex items-center space-x-2">
                        <div class="w-8 h-8 rounded-full bg-blue-500 text-white flex items-center justify-center font-bold text-xs" id="userAvatar">A</div>
                        <div>
                            <p class="text-xs font-semibold text-white" id="userNameDisplay">Admin</p>
                            <p class="text-[10px] text-slate-400" id="userRoleDisplay">Administrator</p>
                        </div>
                    </div>
                </div>
                <button onclick="handleLogout()" class="w-full flex items-center justify-center space-x-2 bg-slate-800 hover:bg-red-600 hover:text-white text-slate-300 py-2 rounded-lg text-xs font-semibold transition">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Keluar Sistem</span>
                </button>
            </div>
        </aside>

        <!-- CONTENT AREA -->
        <main class="flex-1 flex flex-col min-w-0 overflow-y-auto">
            <!-- Header -->
            <header class="bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between sticky top-0 z-10 shadow-sm">
                <h2 id="pageTitle" class="text-xl font-bold text-gray-800">Dashboard</h2>
                <div class="text-xs text-gray-500" id="currentDate"></div>
            </header>

            <!-- Body Container -->
            <div class="p-6 max-w-7xl w-full mx-auto flex-1">
                
                <!-- TAB: DASHBOARD -->
                <div id="tab-dashboard" class="space-y-6">
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
                        <div class="bg-white p-5 rounded-2xl border border-gray-100 shadow-sm flex items-center space-x-4">
                            <div class="w-12 h-12 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center text-xl shadow-inner"><i class="fa-solid fa-box"></i></div>
                            <div>
                                <p class="text-xs text-gray-400 font-medium uppercase">Total Jenis Barang</p>
                                <h3 class="text-2xl font-bold text-gray-800" id="statTotalItems">0
